<script>
async function startPreview() {
  const start = parseFloat(document.getElementById("previewStart").value);
  const end = parseFloat(document.getElementById("previewEnd").value);
  if (isNaN(start) || isNaN(end) || end <= start) {
    alert("Please enter valid start and end times.");
    return;
  }

  try {
    const response = await fetch("http://localhost:8000/start-preview", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        start_time: start,
        end_time: end,
        timeline: ledTimeline // Send the current timeline state
      })
    });

    const result = await response.json();
    if (result.status === "ok") {
      console.log("Preview started.");
    } else {
      alert("Preview failed: " + result.message);
    }
  } catch (err) {
    console.error("Error starting preview:", err);
    alert("Preview failed. Check console.");
  }
}
</script>

<script>

    // --- Project Management Functions ---
function saveProjectAs() {
    const projectData = {
        timeline: ledTimeline,
        audioFileName: selectedWavBlob ? selectedWavBlob.name : null
    };

    const fileName = prompt("Enter project name (e.g., my_project.json):", "my_project.json");
    if (!fileName) return;

    const blob = new Blob([JSON.stringify(projectData, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);

    alert("Project saved locally!");
}

function loadProject() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = () => {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const parsedData = JSON.parse(e.target.result);
                // Reset current project
                newProject();

                // Restore timeline
                if (parsedData.timeline) {
                    ledTimeline = parsedData.timeline;
                    nextMarkerId = Math.max(...ledTimeline.map(m => m.id), 0) + 1;
                    renderMarkers();
                }

                // Optional: show warning about missing WAV file
                if (parsedData.audioFileName) {
                    alert(`Please re-upload the audio file: ${parsedData.audioFileName}`);
                }

                alert("Project loaded successfully!");
            } catch (error) {
                console.error("Error parsing project file:", error);
                alert("Invalid project file.");
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

function newProject() {
    if (confirm("Are you sure you want to start a new project? All unsaved changes will be lost.")) {
        ledTimeline = [];
        selectedWavBlob = null;
        wavesurfer.empty(); // Clear waveform
        renderMarkers(); // Clear displayed markers
        resetNewMarkerForm(); // Clear new marker form
        document.getElementById('audioFile').value = ''; // Clear file input
        currentTimeDisplay.textContent = '0:00'; // Reset time displays
        totalDurationDisplay.textContent = '0:00';
        nextMarkerId = 0; // Reset marker ID counter
        alert("New project started.");
    }
}

// Helper function to read file content
function readFileAsText(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (event) => resolve(event.target.result);
        reader.onerror = (event) => reject(event.target.error);
        reader.readAsText(file);
    });
}


  // --- Global Variables ---

  function formatTime(seconds) {

  function rgbToHex(r, g, b) {
    return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);

  function hexToRgb(hex) {
    const bigint = parseInt(hex.slice(1), 16);
    return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];

        params.on_color = hexToRgb(document.getElementById("effectParam_on_color").value);
        params.off_color = hexToRgb(document.getElementById("effectParam_off_color").value);
        params.base_rate = parseInt(document.getElementById("effectParam_base_rate").value);
        params.min_rate = parseInt(document.getElementById("effectParam_min_rate").value);
    } else if (effect === "COMET"){
       params.comet_color = hexToRgb(document.getElementById("effectParam_comet_color").value);
       params.tail_length = parseInt(document.getElementById("effectParam_tail_length").value);
       params.base_speed = parseInt(document.getElementById("effectParam_base_speed").value);
       params.max_speed = parseInt(document.getElementById("effectParam_max_speed").value);
    } else if(effect === "FIRE"){
       params.base_color = hexToRgb(document.getElementById("effectParam_base_color").value);
       params.flicker_intensity = parseFloat(document.getElementById("effectParam_flicker_intensity").value);
    }

    const marker = {
      id: nextMarkerId++, // Assign a unique ID
      start_sec: startSec,
      end_sec: startSec + duration,
      device_id,
      targetLEDS,
      effect,
      params
    };

    ledTimeline.push(marker); // Add new marker to the array
    renderMarkers(); // Re-render the list to show the new marker
    resetNewMarkerForm(); // Clear the input fields for the next marker
  }

  function resetNewMarkerForm() {
    document.getElementById("newStartTime").value = "";
    document.getElementById("newDuration").value = "";
    document.getElementById("newDeviceId").value = ""; // Clear the input field
    document.getElementById("newLeds").value = ""; // Clear the input field
    populateNewEspIdDropdown(); // Re-populate datalist after reset
    populateNewLedsDropdown(); // Re-populate datalist after reset
    document.getElementById("newEffect").value = "STATIC";
    updateEffectInputs(); // Reset effect-specific inputs
  }

  // --- Marker Rendering and Filtering ---

  // Generates a background color for the marker based on its time interval
  function getIntervalColor(intervalIndex) {
    const hue = (intervalIndex * 30) % 360;
    return `hsl(${hue}, 70%, 20%)`;
  }

  // Generates a unique border color for each ESP ID
  function getEspColor(espId) {
    if (!espColors[espId]) {
      let hash = 0;
      for (let i = 0; i < espId.length; i++) {
        hash = espId.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash) % 360;
      espColors[espId] = `hsl(${hue}, 70%, 30%)`;
    }
    return espColors[espId];
  }

  // Populates the ESP filter dropdown with unique device IDs from the timeline
  function populateEspFilter() {
    const filterEsp = document.getElementById("filterEsp");
    filterEsp.innerHTML = '<option value="">All ESPs</option>'; // Default option

    // Get unique ESP IDs from the current timeline markers
    const uniqueEsp = [...new Set(ledTimeline.map(m => m.device_id).filter(Boolean))];
    uniqueEsp.sort().forEach(espId => { // Sort for consistent display
      const option = document.createElement("option");
      option.value = espId;
      option.textContent = espId;
      filterEsp.appendChild(option);
    });

    // Restore the previously selected filter if it still exists
    const currentFilter = filterEsp.dataset.currentFilter || "";
    if (uniqueEsp.includes(currentFilter)) {
        filterEsp.value = currentFilter;
    } else {
        filterEsp.value = ""; // Reset if current filter no longer applies
    }
  }

  // --- Populates the newDeviceId datalist with unique ESP IDs ---
  function populateNewEspIdDropdown() {
      const espIdDatalist = document.getElementById("espIdSuggestions");
      const newDeviceIdInput = document.getElementById("newDeviceId");
      const currentInputValue = newDeviceIdInput.value;

      espIdDatalist.innerHTML = ''; // Clear existing options

      const uniqueEspIds = new Set();
      // Get IDs from currently connected devices
      if (window.connectedEspDevices) {
          window.connectedEspDevices.forEach(device => uniqueEspIds.add(device.id));
      }
      // Also add IDs from the current timeline markers
      ledTimeline.forEach(marker => {
          if (marker.device_id) {
              uniqueEspIds.add(marker.device_id);
          }
      });

      Array.from(uniqueEspIds).sort().forEach(id => {
          const option = document.createElement("option");
          option.value = id;
          espIdDatalist.appendChild(option);
      });

      // Restore the input value
      newDeviceIdInput.value = currentInputValue;
  }

  // --- Populates the newLeds datalist based on unique combinations from existing markers ---
  function populateNewLedsDropdown() {
      const ledsDatalist = document.getElementById("ledSuggestions");
      const newLedsInput = document.getElementById("newLeds");
      const currentInputValue = newLedsInput.value;

      ledsDatalist.innerHTML = ''; // Clear existing options

      const uniqueLedCombinations = new Set();
      // Collect all unique LED combinations (as strings) from existing markers
      ledTimeline.forEach(marker => {
          if (Array.isArray(marker.targetLEDS) && marker.targetLEDS.length > 0) {
              uniqueLedCombinations.add(marker.targetLEDS.join(','));
          }
      });

      // Add options for each unique LED combination
      Array.from(uniqueLedCombinations).sort().forEach(combination => {
          const option = document.createElement("option");
          option.value = combination;
          ledsDatalist.appendChild(option);
      });

      // Restore the input value
      newLedsInput.value = currentInputValue;
  }


  // Main function to render (or re-render) all markers based on current filters
  function renderMarkers() {
    const container = document.getElementById("ledMarkers");
    const espFilter = document.getElementById("filterEsp").value;
    const timeMin = parseFloat(document.getElementById("timeMin").value) || -Infinity;
    const timeMax = parseFloat(document.getElementById("timeMax").value) || Infinity;

    // Store current filter selection before clearing/repopulating
    document.getElementById("filterEsp").dataset.currentFilter = espFilter;

    // Sort markers by start time, then by device ID for consistent display
    const sortedMarkers = [...ledTimeline].sort((a, b) => {
      if (a.start_sec !== b.start_sec) return a.start_sec - b.start_sec;
      return a.device_id.localeCompare(b.device_id);
    });

    container.innerHTML = "<h2>📋 LED Timeline Markers</h2>"; // Clear and re-add heading

    sortedMarkers.forEach((marker) => {
      // Apply filters
      if (espFilter && marker.device_id !== espFilter) return;
      if (marker.start_sec < timeMin || marker.start_sec > timeMax) return;

      const intervalIndex = Math.floor(marker.start_sec / INTERVAL_DURATION);
      const intervalColor = getIntervalColor(intervalIndex); // Background color
      const espColor = marker.device_id ? getEspColor(marker.device_id) : "#444"; // Left border color

      const targetLedsDisplay = Array.isArray(marker.targetLEDS) ? marker.targetLEDS.join(',') : '';
      const duration = (marker.end_sec - marker.start_sec).toFixed(2);
      const params = marker.params || {}; // Ensure params object exists

      // Build HTML for effect-specific parameters dynamically
      let effectSpecificParamsHtml = '';
      if (marker.effect === "STATIC") {
        const color = params.color || [255, 255, 255];
        const hexColor = rgbToHex(color[0], color[1], color[2]);
        effectSpecificParamsHtml = `
          <label>Color <input type="color" value="${hexColor}" onchange="updateMarker(${marker.id}, 'params.color', this.value)"></label>
        `;
      } else if (marker.effect === "BLINK") {
        const onColor = params.on_color || [255, 255, 255];
        const offColor = params.off_color || [0, 0, 0];
        effectSpecificParamsHtml = `
          <label>On Color <input type="color" value="${rgbToHex(onColor[0], onColor[1], onColor[2])}" onchange="updateMarker(${marker.id}, 'params.on_color', this.value)"></label>
          <label>Off Color <input type="color" value="${rgbToHex(offColor[0], offColor[1], offColor[2])}" onchange="updateMarker(${marker.id}, 'params.off_color', this.value)"></label>
          <label>Base Rate (chunks) <input type="number" value="${params.base_rate || 8}" step="1" onchange="updateMarker(${marker.id}, 'params.base_rate', parseInt(this.value))"></label>
          <label>Min Rate (chunks) <input type="number" value="${params.min_rate || 2}" step="1" onchange="updateMarker(${marker.id}, 'params.min_rate', parseInt(this.value))"></label>
        `;
      } else if (marker.effect === "RAINBOW") {
        effectSpecificParamsHtml = `
          <label>Hue Speed <input type="number" value="${params.hue_speed || 0.05}" step="0.01" onchange="updateMarker(${marker.id}, 'params.hue_speed', parseFloat(this.value))"></label>
        `;
      } else if (marker.effect === "CHASE") {
        const chaseColor = params.chase_color || [255, 255, 255];
        const currentDirection = params.direction || "FORWARD"; // Default if not set
        effectSpecificParamsHtml = `
          <label>Chase Color <input type="color" value="${rgbToHex(chaseColor[0], chaseColor[1], chaseColor[2])}" onchange="updateMarker(${marker.id}, 'params.chase_color', this.value)"></label>
          <label>Tail Length <input type="number" value="${params.tail_length || 5}" step="1" onchange="updateMarker(${marker.id}, 'params.tail_length', parseInt(this.value))"></label>
          <label>Direction
            <select onchange="updateMarker(${marker.id}, 'params.direction', this.value)">
              <option value="FORWARD" ${currentDirection === "FORWARD" ? "selected" : ""}>Forward</option>
              <option value="BACKWARD" ${currentDirection === "BACKWARD" ? "selected" : ""}>Backward</option>
            </select>
          </label>
          <label>Base Speed (chunks) <input type="number" value="${params.base_speed || 10}" step="1" onchange="updateMarker(${marker.id}, 'params.base_speed', parseInt(this.value))"></label>
          <label>Max Speed (chunks) <input type="number" value="${params.max_speed || 3}" step="1" onchange="updateMarker(${marker.id}, 'params.max_speed', parseInt(this.value))"></label>
        `;
      }
      else if (marker.effect === "SPARKLE") {
  const sparkleColor = params.sparkle_color || [255, 255, 255];
  const hexColor = rgbToHex(sparkleColor[0], sparkleColor[1], sparkleColor[2]);
  const density = (params.density != null ? params.density : 0.1);
  effectSpecificParamsHtml = `
    <label>Sparkle Color <input type="color" value="${hexColor}" onchange="updateMarker(${marker.id}, 'params.sparkle_color', this.value)"></label>
    <label>Density (0-1) <input type="number" value="${density}" step="0.01" min="0" max="1" onchange="updateMarker(${marker.id}, 'params.density', parseFloat(this.value))"></label>
  `;
} else if (marker.effect === "STROBE") {
  const onColor = params.on_color || [255, 255, 255];
  const offColor = params.off_color || [0, 0, 0];
  effectSpecificParamsHtml = `
    <label>On Color <input type="color" value="${rgbToHex(onColor[0], onColor[1], onColor[2])}" onchange="updateMarker(${marker.id}, 'params.on_color', this.value)"></label>
    <label>Off Color <input type="color" value="${rgbToHex(offColor[0], offColor[1], offColor[2])}" onchange="updateMarker(${marker.id}, 'params.off_color', this.value)"></label>
    <label>Base Rate <input type="number" value="${params.base_rate || 16}" step="1" onchange="updateMarker(${marker.id}, 'params.base_rate', parseInt(this.value))"></label>
    <label>Min Rate <input type="number" value="${params.min_rate || 2}" step="1" onchange="updateMarker(${marker.id}, 'params.min_rate', parseInt(this.value))"></label>
  `;
} else if (marker.effect === "COMET") {
  const cometColor = params.comet_color || [255, 100, 0];
  effectSpecificParamsHtml = `
    <label>Comet Color <input type="color" value="${rgbToHex(cometColor[0], cometColor[1], cometColor[2])}" onchange="updateMarker(${marker.id}, 'params.comet_color', this.value)"></label>
    <label>Tail Length <input type="number" value="${params.tail_length || 5}" step="1" onchange="updateMarker(${marker.id}, 'params.tail_length', parseInt(this.value))"></label>
    <label>Base Speed <input type="number" value="${params.base_speed || 1}" step="1" onchange="updateMarker(${marker.id}, 'params.base_speed', parseInt(this.value))"></label>
    <label>Max Speed <input type="number" value="${params.max_speed || 5}" step="1" onchange="updateMarker(${marker.id}, 'params.max_speed', parseInt(this.value))"></label>
  `;
} else if (marker.effect === "FIRE") {
  const baseColor = params.base_color || [255, 100, 0];
  effectSpecificParamsHtml = `
    <label>Base Color <input type="color" value="${rgbToHex(baseColor[0], baseColor[1], baseColor[2])}" onchange="updateMarker(${marker.id}, 'params.base_color', this.value)"></label>
    <label>Flicker Intensity (0-1) <input type="number" value="${params.flicker_intensity != null ? params.flicker_intensity : 0.5}" step="0.01" min="0" max="1" onchange="updateMarker(${marker.id}, 'params.flicker_intensity', parseFloat(this.value))"></label>
  `;
}

      // FFT has no configurable parameters

      container.innerHTML += `
        <div class="marker" style="background-color: ${intervalColor}; border-left-color: ${espColor};">
          <div class="marker-header">
            <h4>LED Marker (ID: ${marker.id})</h4>
            <button class="delete-button" data-marker-id="${marker.id}">🗑️ Delete</button>
          </div>
          <label>Start Time (sec) <input type="number" value="${marker.start_sec.toFixed(2)}" step="0.1" onchange="updateMarker(${marker.id}, 'start_sec', parseFloat(this.value))"></label>
          <label>Duration <input type="number" value="${duration}" step="0.1" onchange="updateMarker(${marker.id}, 'duration_calc', parseFloat(this.value))"></label>
          <label>Target ESP32 ID <input type="text" value="${marker.device_id}" onchange="updateMarker(${marker.id}, 'device_id', this.value)"></label>
          <label>Target LEDs (e.g., 0,99 or 10,20) <input type="text" value="${targetLedsDisplay}" onchange="updateMarker(${marker.id}, 'targetLEDS', this.value)"></label>
          <label>Effect
            <select onchange="updateMarker(${marker.id}, 'effect', this.value)">
              <option value="STATIC" ${marker.effect === "STATIC" ? "selected" : ""}>Static</option>
              <option value="FFT" ${marker.effect === "FFT" ? "selected" : ""}>FFT</option>
              <option value="BLINK" ${marker.effect === "BLINK" ? "selected" : ""}>Blink</option>
              <option value="RAINBOW" ${marker.effect === "RAINBOW" ? "selected" : ""}>Rainbow</option>
              <option value="CHASE" ${marker.effect === "CHASE" ? "selected" : ""}>Chase</option>
              <option value="SPARKLE" ${marker.effect === "SPARKLE" ? "selected" : ""}>Sparkle</option>
              <option value="STROBE" ${marker.effect === "STROBE" ? "selected" : ""}>Strobe</option>
              <option value="COMET" ${marker.effect === "COMET" ? "selected" : ""}>Comet</option>
              <option value="FIRE" ${marker.effect === "FIRE" ? "selected" : ""}>Fire</option>
            </select>
          </label>
          <div class="effect-params">
            ${effectSpecificParamsHtml}
          </div>
        </div>
      `;
    });
    addDeleteButtonListeners(); // Attach delete listeners after rendering
    populateEspFilter(); // Update filter dropdown with current ESP IDs
    populateNewEspIdDropdown(); // Populate the 'Add New Marker' ESP ID datalist
    populateNewLedsDropdown(); // Populate the 'Add New Marker' LEDs datalist
  }

  // Attaches event listeners to all delete buttons
  function addDeleteButtonListeners() {
      document.querySelectorAll('.delete-button').forEach(button => {
          button.onclick = (event) => {
              const markerId = parseInt(event.target.dataset.markerId, 10);
              deleteMarker(markerId);
          };
      });
  }

  // --- Marker Update and Deletion Functions ---
  function updateMarker(markerId, field, value) {
    const markerIndex = ledTimeline.findIndex(m => m.id === markerId);
    if (markerIndex === -1) {
        console.warn(`Marker with ID ${markerId} not found for update.`);
        return;
    }
    const marker = ledTimeline[markerIndex];

    if (field === 'duration_calc') {
      marker.end_sec = marker.start_sec + value;
    } else if (field === 'start_sec') {
      marker.start_sec = value;
      // Ensure end_sec also adjusts if start_sec changes, maintaining duration
      // You might want to decide if duration should be fixed or end_sec should be fixed
      // For now, let's keep duration fixed if only start_sec changes
      marker.end_sec = marker.start_sec + (marker.end_sec - (marker.start_sec - (marker.end_sec - marker.start_sec))); // Recalculate based on original duration
    }
    else if (field.startsWith('params.')) {
      const paramField = field.substring(7); // Remove 'params.' prefix
      if (!marker.params) marker.params = {}; // Ensure params object exists
      if (paramField.includes('color')) { // Handle color conversions
        marker.params[paramField] = hexToRgb(value);
      } else if (paramField === 'base_rate' || paramField === 'min_rate' || paramField === 'tail_length' || paramField === 'base_speed' || paramField === 'max_speed') {
        marker.params[paramField] = parseInt(value);
      } else if (paramField === 'hue_speed') {
        marker.params[paramField] = parseFloat(value);
      }
      else {
        marker.params[paramField] = value;
      }
    } else if (field === 'targetLEDS') {
      // Convert comma-separated string to an array of numbers, with validation
      const parts = value.split(',').map(s => parseInt(s.trim(), 10));
      if (parts.every(num => !isNaN(num) && num >= 0)) {
          marker.targetLEDS = [...new Set(parts)].sort((a,b) => a-b); // Ensure unique and sorted
      } else {
          alert("Invalid LED range format. Please use comma-separated positive numbers (e.g., 0,99).");
          renderMarkers(); // Re-render to revert invalid input
          return;
      }
    } else if (field === 'effect') {
      marker.effect = value;
      // Re-initialize params based on new effect type, preserving existing if applicable
      marker.params = { ...getDefaultParams(value), ...marker.params }; // Merge defaults with existing params
      renderMarkers(); // Re-render to show correct parameters for the new effect
      return; // Exit as renderMarkers will handle the update
    } else {
      marker[field] = value;
    }

    // Refresh ESP ID and LED suggestions after any update that might add new values
    populateNewEspIdDropdown();
    populateNewLedsDropdown();

    // Re-render only if the effect didn't change (as effect change triggers its own render)
    if (field !== 'effect') {
        renderMarkers();
    }
    console.log('Updated timeline:', ledTimeline); // For debugging
  }


  function deleteMarker(markerId) {
    if (confirm("Are you sure you want to delete this marker?")) {
      const initialLength = ledTimeline.length;
      ledTimeline = ledTimeline.filter(marker => marker.id !== markerId);
      if (ledTimeline.length < initialLength) { // Check if a marker was actually removed
          renderMarkers(); // Re-render if successful deletion
      } else {
          console.warn(`Marker with ID ${markerId} not found for deletion.`);
      }
      populateNewEspIdDropdown(); // Update suggestions after deletion
      populateNewLedsDropdown(); // Update suggestions after deletion
    }
  }

  // --- Filter Control Functions ---
  function resetFilters() {
    document.getElementById("filterEsp").value = "";
    document.getElementById("timeMin").value = "";
    document.getElementById("timeMax").value = "";
    renderMarkers(); // Re-render after resetting filters
  }

  // --- Project Export Function ---
  function uploadProject() {
    if (!selectedWavBlob || ledTimeline.length === 0) {
      alert("Please select a .wav file and set timeline data.");
      return;
    }

    const timeline = {
      audioFile: selectedWavBlob.name,
      events: ledTimeline
    };
    const formData = new FormData();
    formData.append("file", selectedWavBlob);
    formData.append("timeline", JSON.stringify(timeline));

    // Show loading indicator
    document.body.style.cursor = 'wait';
    const exportButton = document.getElementById("exportTimelineButton");
    const originalButtonText = exportButton.textContent;
    exportButton.textContent = 'Uploading...';
    exportButton.disabled = true;

    fetch("http://localhost:8000/upload-project", {
      method: "POST",
      body: formData
    })
      .then(res => res.json())
      .then(data => {
        if (data.status === "ok") {
          window.location.href = "processing.html";
        } else {
          alert("❌ Upload failed.");
        }
      })
      .catch(err => {
        alert("❌ Upload error.");
        console.error(err);
      })
      .finally(() => {
        document.body.style.cursor = 'default';
        exportButton.textContent = originalButtonText;
        exportButton.disabled = false;
      });
  }

  // --- Event Listeners ---
  document.addEventListener('DOMContentLoaded', () => {
    // Initialize effect-specific inputs for the Add New Marker form
    updateEffectInputs();
    // Render any pre-existing markers (or an empty list) on page load
    renderMarkers(); // This call will internally trigger datalist populations too

    // Attach event listeners to buttons and inputs
    document.getElementById('audioFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.name.toLowerCase().endsWith('.wav')) {
          alert("Please select a .wav file.");
          e.target.value = ''; // Clear the input
          selectedWavBlob = null;
          return;
      }
      selectedWavBlob = file;
      const audioUrl = URL.createObjectURL(file);
      wavesurfer.load(audioUrl);
    });

    document.getElementById('playPauseButton').addEventListener('click', () => wavesurfer.playPause());
    document.getElementById('addMarkerButton').addEventListener('click', addCustomMarkerFromForm);
    document.getElementById('newEffect').addEventListener('change', updateEffectInputs); // For the new marker form

    // Filter event listeners
    document.getElementById('filterEsp').addEventListener('change', renderMarkers);
    document.getElementById('timeMin').addEventListener('input', renderMarkers); // Use 'input' for real-time filtering
    document.getElementById('timeMax').addEventListener('input', renderMarkers); // Use 'input' for real-time filtering
    document.getElementById('resetFiltersButton').addEventListener('click', resetFilters);

    document.getElementById('exportTimelineButton').addEventListener('click', uploadProject);


    document.getElementById('saveProjectAsButton').addEventListener('click', saveProjectAs);
    document.getElementById('loadProjectButton').addEventListener('click', loadProject);
    document.getElementById('newProjectButton').addEventListener('click', newProject);

    // Initial population of the new marker datalists on load
    populateNewEspIdDropdown();
    populateNewLedsDropdown();
  });
</script>
